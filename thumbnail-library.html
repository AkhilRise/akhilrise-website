const grid=document.getElementById("templateGrid");
templates.forEach((t,i)=>{
  const n=String(i+1).padStart(2,"0");
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`<div class="thumbnail"><img src="thumbnails/thumbnail-${n}.jpg" alt="${t.name} AI thumbnail" loading="lazy"></div><div class="card-content"><div class="template-number">Template ${n}</div><h3>${t.name}</h3><button class="copy-btn" onclick="openPrompt(${i})">View Prompt</button></div>`;
  grid.appendChild(card);
});

let currentPrompt="";

function getEditableFields(prompt){
  const matches = prompt.match(/\[[^\]]+\]/g) || [];
  const ignore = new Set(["[SQUARE BRACKETS]","[BRACKETS]"]);
  return [...new Set(matches.filter(x => !ignore.has(x)))];
}

function formatPrompt(prompt){
  let safe = prompt
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

  safe = safe.replace(/\[([^\]]+)\]/g, '<span class="editable">[$1]</span>');

  const headingLines = [
    "EDITABLE FIELDS:",
    "EDITABLE TEXT:",
    "Replace the editable text:",
    "Replace:",
    "IMPORTANT:",
    "TEXT REPLACEMENT:",
    "PERSON REPLACEMENT:",
    "DESIGN:",
    "TEMPLATE-SPECIFIC INSTRUCTIONS:"
  ];

  safe = safe.split("\n").map(line => {
    const clean=line.replace(/<[^>]*>/g,"").trim();
    if(headingLines.includes(clean)) return '<span class="prompt-heading">'+line+'</span>';
    return line;
  }).join("\n");

  return safe;
}

function openPrompt(i){
  currentPrompt=templates[i].prompt;
  document.getElementById("modalTitle").innerText=templates[i].name;

  const fields=getEditableFields(currentPrompt);
  const guide=document.getElementById("editGuide");

  guide.innerHTML=`
    <div class="edit-guide">
      <div class="edit-guide-title">✏️ CHANGE THESE TEXTS</div>
      <div class="edit-guide-sub">Replace the highlighted bracket fields with your own wording. Keep the rest of the prompt unchanged.</div>
      <div class="edit-fields">
        ${fields.map(f=>`<span class="edit-field">${f}</span>`).join("")}
      </div>
    </div>`;

  document.getElementById("promptText").innerHTML=formatPrompt(currentPrompt);
  document.getElementById("promptModal").classList.add("active");
}

function closePrompt(){
  document.getElementById("promptModal").classList.remove("active");
}

async function copyPrompt(){
  try{
    await navigator.clipboard.writeText(currentPrompt);
    const b=document.querySelector(".modal-copy");
    b.innerText="✓ Prompt Copied!";
    setTimeout(()=>b.innerText="Copy Prompt",1800);
  }catch(e){
    alert("Please select and copy the prompt manually.");
  }
}

document.getElementById("promptModal").addEventListener("click",e=>{
  if(e.target===document.getElementById("promptModal"))closePrompt();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closePrompt();
});
